[workspace]
members = ["crates/google-api-discovery"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "gdrive"
version = "3.9.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
async-recursion = "1.0.2"
bytes = "1.3.0"
bytesize = "2.0.1"
chrono = { version = "0.4.41", default-features = false }
clap = { version = "4.5.41", features = ["derive"] }
error-trace = { version = "4.0.0", default-features = false }
exponential-backoff = "2.1.1"
futures = "0.3.25"
google-apis-common = { version = "8.0.0", default-features = false }
google-drive3 = "7.0.0"
home = "0.5.4"
http-body-util = "0.1.5"
hyper = "1.5.2"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
md5 = "0.7.0"
mime = "0.3.16"
mime_guess = "2.0.4"
mktemp = "0.5.0"
pin-project-lite = "0.2.16"
rustc_version_runtime = "0.2.1"
serde.workspace = true
serde_json.workspace = true
tabwriter = "1.2.1"
tar = "0.4.38"
tempfile = "3.3.0"
tokio = { version = "1.23.0", features = ["full"] }
yup-oauth2 = { version = "12.1.2", default-features = false }

